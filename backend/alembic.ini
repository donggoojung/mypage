[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# alembic/env.py 에서 app.core.config.Settings 로부터 실제 URL을 주입하므로
# 여기 sqlalchemy.url 은 사용되지 않는다 (fallback 용도로만 유지).
sqlalchemy.url = postgresql+psycopg2://fulfillment:fulfillment@localhost:5432/fulfillment

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
