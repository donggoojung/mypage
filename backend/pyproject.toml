[tool.poetry]
name = "brand-fulfillment-automation"
version = "0.1.0"
description = "국내 멀티 플랫폼 연계형 브랜드 위탁판매 및 구매대행 자동화 시스템"
authors = ["Your Company <ops@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
sqlalchemy = "^2.0.36"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.10"
alembic = "^1.13.3"
celery = "^5.4.0"
redis = "^5.2.0"
playwright = "^1.48.0"
boto3 = "^1.35.0"
python-dotenv = "^1.0.1"
httpx = "^0.27.2"
Pillow = "^11.0.0"
Jinja2 = "^3.1.4"
rembg = {version = "^2.0.84", extras = ["cpu"]}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
aiosqlite = "^0.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
