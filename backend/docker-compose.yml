services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fulfillment
      POSTGRES_PASSWORD: fulfillment
      POSTGRES_DB: fulfillment
    ports:
      # 호스트 쪽 포트를 5433으로 바꿈 — Windows가 5432를 예약 포트로 막아두는
      # 경우가 있어서(WinError 10013), 컨테이너 안쪽은 그대로 5432를 쓰고
      # 밖에서 접속하는 포트만 5433으로 옮긴다.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfillment"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
