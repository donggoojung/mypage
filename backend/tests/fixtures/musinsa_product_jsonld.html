<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>나이키 에어포스 1 '07 화이트 - 무신사(테스트용 가상 픽스처, 실사이트 아님)</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Product",
  "name": "나이키 에어포스 1 '07 화이트 CW2288-111",
  "image": ["https://mock.musinsa.example.com/images/CW2288-111.jpg"],
  "brand": { "@type": "Brand", "name": "나이키" },
  "offers": {
    "@type": "Offer",
    "price": "139000",
    "priceCurrency": "KRW"
  }
}
</script>
</head>
<body>
  <h1>나이키 에어포스 1 '07 화이트 CW2288-111</h1>
  <!-- 실사이트 미검증 — MusinsaScraper 파싱 로직 자체만 검증하기 위한 가상 픽스처.
       2026-09-23 실제 PDP로 확인된 사실을 그대로 흉내낸다: 사이즈는 닫힌 드롭다운(input)이고,
       옵션은 클릭해서 열기 전까지 DOM에 없으며, 열리면 각 항목이 "N (품절)" 또는
       "N" + 형제 요소의 "n개 남음" 형태로 나온다. -->
  <input type="text" readonly data-mds="DropdownTriggerInput" placeholder="사이즈" id="size-trigger">
  <div id="size-list-container"></div>
  <script>
    document.getElementById('size-trigger').addEventListener('click', function () {
      var container = document.getElementById('size-list-container');
      container.innerHTML =
        '<div data-mds="StaticDropdownMenuItem"><div class="DropdownItemContent__ContentColumn">250<div>09.28(월) 도착보장</div></div>' +
        '<div class="BackFillItemContent__RemainQuantityWrap"><span>5개 남음</span></div></div>' +
        '<div data-mds="StaticDropdownMenuItem"><div class="DropdownItemContent__ContentColumn">260 (품절)</div></div>' +
        '<div data-mds="StaticDropdownMenuItem"><div class="DropdownItemContent__ContentColumn">270<div>09.28(월) 도착보장</div></div>' +
        '<div class="BackFillItemContent__RemainQuantityWrap"><span>2개 남음</span></div></div>';
    });
  </script>
</body>
</html>
