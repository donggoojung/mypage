<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>브랜드 구매대행 자동화 대시보드</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --border: #e2e5ea;
    --text: #1f2430;
    --muted: #6b7280;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --success: #16a34a;
    --danger: #dc2626;
    --warn: #d97706;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  main {
    max-width: 1000px;
    margin: 24px auto;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .card h2 {
    margin: 0 0 14px;
    font-size: 16px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type="text"], input[type="number"], select {
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }
  #url-input { flex: 1; min-width: 240px; }
  button {
    padding: 9px 16px;
    border: none;
    border-radius: 6px;
    background: var(--primary);
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: var(--primary-hover); }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  button.secondary { background: #6b7280; }
  button.secondary:hover { background: #4b5563; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .options-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
    margin-top: 10px;
  }
  .options-grid label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 4px; }
  #status-box {
    margin-top: 14px;
    padding: 12px;
    border-radius: 8px;
    background: #f1f5f9;
    font-size: 13px;
    display: none;
    white-space: pre-wrap;
  }
  #status-box.show { display: block; }
  #status-box.pending { border-left: 4px solid var(--warn); }
  #status-box.success { border-left: 4px solid var(--success); }
  #status-box.failure { border-left: 4px solid var(--danger); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  img.thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; background: #eee; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; }
  .badge.active { background: #dcfce7; color: #15803d; }
  .badge.draft { background: #fef3c7; color: #92400e; }
  .badge.other { background: #e5e7eb; color: #374151; }
  .empty { color: var(--muted); font-size: 13px; padding: 12px 0; }
  .card-header-row { display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>

<header>
  <h1>브랜드 구매대행 자동화 대시보드</h1>
  <p>ABC마트 URL을 넣으면 크롤링 → 가격계산 → AI 이미지 생성 → 쿠팡 등록까지 자동으로 진행됩니다.</p>
</header>

<main>
  <section class="card">
    <h2>새 상품 등록</h2>
    <div class="row">
      <input id="url-input" type="text" placeholder="ABC마트 상품 상세 URL을 붙여넣으세요">
      <button id="run-btn" onclick="runPipeline()">등록하기</button>
    </div>
    <details>
      <summary>고급 옵션 (선택)</summary>
      <div class="options-grid">
        <label>목표 마진율
          <input id="opt-margin-rate" type="number" step="0.01" value="0.30">
        </label>
        <label>고정 마진(원)
          <input id="opt-fixed-margin" type="number" step="1000" value="5000">
        </label>
        <label>쿠팡 전시카테고리 코드
          <input id="opt-category-code" type="number" value="56137">
        </label>
        <label>실제 판매 심사요청
          <select id="opt-request-approval">
            <option value="false" selected>임시저장까지만 (안전, 권장)</option>
            <option value="true">즉시 승인요청 (실제 판매 시작)</option>
          </select>
        </label>
      </div>
    </details>
    <div id="status-box"></div>
  </section>

  <section class="card">
    <div class="card-header-row">
      <h2>등록된 상품</h2>
      <div class="row">
        <button class="secondary" onclick="refreshAllProducts()" id="refresh-all-btn">전체 갱신</button>
        <button class="secondary" onclick="loadProducts()">새로고침</button>
      </div>
    </div>
    <p class="empty" style="margin-top:-6px">"전체 갱신" = 이미 등록된 상품 전부를 저장된 URL로 다시 크롤링/등록해 최신 코드 기준으로 맞춥니다.</p>
    <div id="refresh-all-status"></div>
    <div id="products-area"><p class="empty">불러오는 중...</p></div>
  </section>

  <section class="card">
    <div class="card-header-row">
      <h2>주문 현황</h2>
      <button class="secondary" onclick="loadOrders()">새로고침</button>
    </div>
    <div id="orders-area"><p class="empty">불러오는 중...</p></div>
  </section>
</main>

<script>
const STATUS_LABELS = {
  active: "판매중", draft: "임시저장", sold_out: "품절", suspended: "판매중지",
  received: "주문접수", sourcing_in_progress: "소싱중", order_purchased: "매입완료",
  shipped: "배송중", delivered: "배송완료", cancelled: "취소", refunded: "환불",
};

function badgeClass(status) {
  if (status === "active") return "active";
  if (status === "draft") return "draft";
  return "other";
}

function fmtWon(n) {
  return n === null || n === undefined ? "-" : Number(n).toLocaleString("ko-KR") + "원";
}

async function runPipeline() {
  const url = document.getElementById("url-input").value.trim();
  const statusBox = document.getElementById("status-box");
  const runBtn = document.getElementById("run-btn");

  if (!url) {
    alert("ABC마트 상품 URL을 입력해주세요.");
    return;
  }

  const payload = {
    url,
    target_margin_rate: parseFloat(document.getElementById("opt-margin-rate").value) || 0.30,
    fixed_margin: parseFloat(document.getElementById("opt-fixed-margin").value) || 5000,
    display_category_code: parseInt(document.getElementById("opt-category-code").value) || 56137,
    request_approval: document.getElementById("opt-request-approval").value === "true",
  };

  runBtn.disabled = true;
  statusBox.className = "show pending";
  statusBox.textContent = "등록 요청을 보냈습니다...";

  let taskId;
  try {
    const res = await fetch("/api/pipeline/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error(`서버 오류 (${res.status})`);
    const data = await res.json();
    taskId = data.task_id;
  } catch (err) {
    statusBox.className = "show failure";
    statusBox.textContent = "요청 실패: " + err.message;
    runBtn.disabled = false;
    return;
  }

  pollStatus(taskId, statusBox, runBtn);
}

async function pollStatus(taskId, statusBox, runBtn) {
  statusBox.className = "show pending";
  statusBox.textContent = "[1/5] ABC마트 크롤링 → [2/5] 가격계산 → [3/5] DB저장 → [4/5] AI 이미지 생성 → [5/5] 쿠팡 등록\n\n진행 중... (몇 초~몇십 초 정도 걸릴 수 있어요)";

  const poll = async () => {
    let data;
    try {
      const res = await fetch(`/api/pipeline/status/${taskId}`);
      data = await res.json();
    } catch (err) {
      setTimeout(poll, 3000);
      return;
    }

    if (data.state === "SUCCESS") {
      const r = data.result;
      statusBox.className = "show success";
      statusBox.textContent =
        `등록 완료!\n` +
        `상품: ${r.brand_name} ${r.product_name} (품번 ${r.style_code})\n` +
        `원가 ${fmtWon(r.purchase_cost)} → 판매가 ${fmtWon(r.selling_price)}\n` +
        `쿠팡 상태: ${STATUS_LABELS[r.listing_status] || r.listing_status}` +
        (r.listing_status === "draft" ? " (임시저장 — WING에서 확인 후 승인요청 필요)" : "");
      runBtn.disabled = false;
      document.getElementById("url-input").value = "";
      loadProducts();
    } else if (data.state === "FAILURE") {
      statusBox.className = "show failure";
      statusBox.textContent = "등록 실패: " + (data.error || "알 수 없는 오류");
      runBtn.disabled = false;
    } else {
      setTimeout(poll, 2500);
    }
  };

  poll();
}

async function refreshAllProducts() {
  const btn = document.getElementById("refresh-all-btn");
  const statusBox = document.getElementById("refresh-all-status");

  if (!confirm("등록된 상품 전부를 저장된 URL로 다시 크롤링/등록합니다. 계속할까요?")) return;

  btn.disabled = true;
  statusBox.className = "status-box show pending";
  statusBox.id = "refresh-all-status";
  statusBox.style.cssText = "margin:10px 0;padding:12px;border-radius:8px;background:#f1f5f9;font-size:13px;white-space:pre-wrap;border-left:4px solid #d97706";
  statusBox.textContent = "요청을 보냈습니다...";

  let taskId;
  try {
    const res = await fetch("/api/pipeline/refresh-all", { method: "POST" });
    if (!res.ok) throw new Error(`서버 오류 (${res.status})`);
    taskId = (await res.json()).task_id;
  } catch (err) {
    statusBox.style.borderLeftColor = "#dc2626";
    statusBox.textContent = "요청 실패: " + err.message;
    btn.disabled = false;
    return;
  }

  const poll = async () => {
    let data;
    try {
      const res = await fetch(`/api/pipeline/status/${taskId}`);
      data = await res.json();
    } catch (err) {
      setTimeout(poll, 3000);
      return;
    }

    if (data.state === "SUCCESS") {
      const r = data.result;
      statusBox.style.borderLeftColor = "#16a34a";
      statusBox.textContent = `전체 갱신 완료: 총 ${r.total}건 중 성공 ${r.succeeded.length}건 / 실패 ${r.failed.length}건`;
      if (r.failed.length) {
        statusBox.textContent += "\n\n실패 목록:\n" + r.failed.map(f => `- ${f.url}: ${f.error}`).join("\n");
      }
      btn.disabled = false;
      loadProducts();
    } else if (data.state === "FAILURE") {
      statusBox.style.borderLeftColor = "#dc2626";
      statusBox.textContent = "전체 갱신 실패: " + (data.error || "알 수 없는 오류");
      btn.disabled = false;
    } else {
      if (data.meta && data.meta.step) statusBox.textContent = data.meta.step;
      setTimeout(poll, 2500);
    }
  };
  poll();
}

async function loadProducts() {
  const area = document.getElementById("products-area");
  let items;
  try {
    items = await (await fetch("/api/products")).json();
  } catch (err) {
    area.innerHTML = `<p class="empty">불러오기 실패: ${err.message}</p>`;
    return;
  }

  if (!items.length) {
    area.innerHTML = `<p class="empty">아직 등록된 상품이 없습니다. 위에서 URL을 넣어 첫 상품을 등록해보세요.</p>`;
    return;
  }

  const rows = items.map(p => `
    <tr>
      <td>${p.thumbnail_url ? `<img class="thumb" src="${p.thumbnail_url}">` : "-"}</td>
      <td>${p.brand_name || "-"}</td>
      <td>${p.product_name || "-"}</td>
      <td>${p.style_code}</td>
      <td>${fmtWon(p.selling_price)}</td>
      <td>${p.listing_status ? `<span class="badge ${badgeClass(p.listing_status)}">${STATUS_LABELS[p.listing_status] || p.listing_status}</span>` : "-"}</td>
    </tr>
  `).join("");

  area.innerHTML = `
    <table>
      <thead><tr><th>이미지</th><th>브랜드</th><th>상품명</th><th>품번</th><th>판매가</th><th>상태</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

async function loadOrders() {
  const area = document.getElementById("orders-area");
  let items;
  try {
    items = await (await fetch("/api/orders")).json();
  } catch (err) {
    area.innerHTML = `<p class="empty">불러오기 실패: ${err.message}</p>`;
    return;
  }

  if (!items.length) {
    area.innerHTML = `<p class="empty">아직 들어온 주문이 없습니다.</p>`;
    return;
  }

  const rows = items.map(o => `
    <tr>
      <td>${o.market_order_id}</td>
      <td>${o.product_name || "-"} (${o.ordered_size}, ${o.quantity}개)</td>
      <td>${o.recipient_name}</td>
      <td>${fmtWon(o.paid_amount)}</td>
      <td><span class="badge ${badgeClass(o.status)}">${STATUS_LABELS[o.status] || o.status}</span></td>
      <td>${o.tracking_no || "-"}</td>
    </tr>
  `).join("");

  area.innerHTML = `
    <table>
      <thead><tr><th>주문번호</th><th>상품</th><th>수취인</th><th>결제금액</th><th>상태</th><th>운송장</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

loadProducts();
loadOrders();
</script>
</body>
</html>
